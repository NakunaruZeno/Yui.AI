<!DOCTYPE html>
<html lang="vi" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yui.AI — Cardinal Workspace</title>
  <link rel="stylesheet" href="../styles/sao-theme.css">
  <link rel="stylesheet" href="../styles/dashboard.css">
</head>

<body>
  <div class="dashboard-wrapper">

    <!-- ═══ Top Cardinal Command Toolbar ═══ -->
    <header class="toolbar" id="toolbar">
      <div class="toolbar-left">
        <div class="toolbar-brand">
          <div class="toolbar-emblem">
            <img
              src="../../assets/icons/logo.svg"
              alt="Yui.AI"
              class="logo-icon-img"
              width="22"
              height="22"
              onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"
            />
            <span style="display:none">Y</span>
          </div>
          <h1 class="toolbar-title">YUI<span class="title-dot">.</span>AI</h1>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Quick Neural Node Switcher / Toggles -->
        <nav class="node-tabs" id="nodeTabsContainer" aria-label="AI Nodes">
          <button type="button" class="node-tab" data-ai="ChatGPT" title="Toggle or Focus ChatGPT">
            <span class="node-tab-dot"></span>
            <span class="node-tab-name">ChatGPT</span>
          </button>
          <button type="button" class="node-tab" data-ai="Claude" title="Toggle or Focus Claude">
            <span class="node-tab-dot"></span>
            <span class="node-tab-name">Claude</span>
          </button>
          <button type="button" class="node-tab" data-ai="Gemini" title="Toggle or Focus Gemini">
            <span class="node-tab-dot"></span>
            <span class="node-tab-name">Gemini</span>
          </button>
        </nav>
      </div>

      <div class="toolbar-center">
        <!-- Functional Layout Switcher -->
        <div class="layout-controls" role="group" aria-label="Workspace Layout">
          <button type="button" class="layout-btn sao-tooltip sao-tooltip-bottom" data-layout="1" data-tooltip="Focus Mode (1 Column)">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="1.5" y="2" width="13" height="12" rx="1.5"/>
            </svg>
            <span class="layout-btn-label">1</span>
          </button>
          <button type="button" class="layout-btn sao-tooltip sao-tooltip-bottom" data-layout="2" data-tooltip="Dual Split (2 Columns)">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="1.5" y="2" width="5.5" height="12" rx="1"/>
              <rect x="9" y="2" width="5.5" height="12" rx="1"/>
            </svg>
            <span class="layout-btn-label">2</span>
          </button>
          <button type="button" class="layout-btn active sao-tooltip sao-tooltip-bottom" data-layout="3" data-tooltip="Triple Link (3 Columns)">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="1" y="2" width="3.8" height="12" rx="1"/>
              <rect x="6.1" y="2" width="3.8" height="12" rx="1"/>
              <rect x="11.2" y="2" width="3.8" height="12" rx="1"/>
            </svg>
            <span class="layout-btn-label">3</span>
          </button>
        </div>
      </div>

      <div class="toolbar-right">
        <!-- Add Node Modal Trigger -->
        <button type="button" class="toolbar-btn sao-tooltip sao-tooltip-bottom" id="btnAddPanel" data-tooltip="Manage AI Nodes">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>Nodes</span>
        </button>

        <!-- Screen Capture Button -->
        <button type="button" class="toolbar-btn capture-btn sao-tooltip sao-tooltip-bottom" id="btnToolbarCapture" data-tooltip="Screen Capture (Ctrl+Shift+X)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3H5a2 2 0 0 0-2 2v2m14-4h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <span>Capture</span>
        </button>

        <!-- Radial Ring Menu Trigger -->
        <button type="button" class="toolbar-btn multicast-btn sao-tooltip sao-tooltip-bottom" id="btnMulticast" data-tooltip="Open Radial Command Ring">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="3"/>
            <line x1="12" y1="3" x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="21"/>
            <line x1="3" y1="12" x2="6" y2="12"/>
            <line x1="18" y1="12" x2="21" y2="12"/>
          </svg>
          <span>Ring HUD</span>
        </button>

        <!-- Theme Toggle -->
        <button type="button" class="toolbar-icon-btn sao-tooltip sao-tooltip-bottom" id="btnDashTheme" data-tooltip="Toggle Theme" aria-label="Toggle Theme">
          <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ═══ Split-Pane AI Panels Container ═══ -->
    <main class="panels-container" id="panelsContainer">
      <!-- AI Panels injected dynamically by dashboard.js -->
    </main>

    <!-- ═══ Bottom All-Link Omni-Command Bar & Status ═══ -->
    <footer class="command-footer" id="statusBar">
      <!-- Staged Image Attachment Pill (shown when an image is captured/pasted) -->
      <div class="staged-attachment" id="stagedAttachment" style="display:none;">
        <img id="stagedThumb" class="staged-thumb" alt="Staged capture" />
        <span class="staged-label">IMAGE LOCKED</span>
        <button type="button" class="staged-clear-btn" id="btnClearStaged" title="Remove staged image" aria-label="Remove staged image">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Omni-Prompt Input Area -->
      <div class="omni-bar">
        <input type="file" id="omniFileInput" accept="image/*" style="display:none;" />
        <button type="button" class="omni-attach-btn sao-tooltip" id="btnAttachImage" data-tooltip="Attach or Paste Image">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>

        <input
          type="text"
          id="omniPromptInput"
          class="omni-input"
          placeholder="All-Link Command — Type a prompt or paste an image (Ctrl+V) to broadcast across all open AIs..."
          autocomplete="off"
        />

        <!-- Quick Prompt Chips -->
        <div class="omni-presets" id="omniPresets">
          <button type="button" class="omni-chip" data-prompt="Explain this in detail and compare approaches.">Explain</button>
          <button type="button" class="omni-chip" data-prompt="Find any bugs or edge cases and provide fixed code.">Debug</button>
          <button type="button" class="omni-chip" data-prompt="Summarize the key takeaways concisely.">Summarize</button>
        </div>

        <button type="button" class="omni-send-btn" id="btnOmniSend" title="Broadcast to all open AIs (Enter)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          <span>All-Link Send</span>
        </button>
      </div>

      <!-- System Status Readout -->
      <div class="status-readout">
        <span class="status-diamond online"></span>
        <span class="status-text" id="statusText">CARDINAL READY</span>
      </div>
    </footer>

    <!-- ═══ Add / Manage AI Nodes Modal ═══ -->
    <div class="add-panel-overlay" id="addPanelOverlay" style="display:none;">
      <div class="add-panel-modal sao-panel sao-animate-scale-in">
        <div class="modal-header">
          <span class="modal-tag">CARDINAL SYSTEM // NODE SELECTOR</span>
          <h2 class="modal-title">Configure Neural Links</h2>
          <p class="modal-subtitle">Select an AI node to link into the workspace or launch all nodes simultaneously.</p>
        </div>

        <div class="ai-selector-grid">
          <button type="button" class="ai-select-card" data-ai="ChatGPT">
            <div class="ai-select-icon chatgpt-color">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a4.5 4.5 0 0 0-3.89 2.25L4.2 11a4.5 4.5 0 0 0 0 4.5l3.91 6.75a4.5 4.5 0 0 0 7.78 0L19.8 15.5a4.5 4.5 0 0 0 0-4.5L15.89 4.25A4.5 4.5 0 0 0 12 2Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </div>
            <span class="ai-select-name">ChatGPT</span>
            <span class="ai-select-state" id="modalStateChatGPT">OpenAI</span>
          </button>

          <button type="button" class="ai-select-card" data-ai="Claude">
            <div class="ai-select-icon claude-color">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>
              </svg>
            </div>
            <span class="ai-select-name">Claude</span>
            <span class="ai-select-state" id="modalStateClaude">Anthropic</span>
          </button>

          <button type="button" class="ai-select-card" data-ai="Gemini">
            <div class="ai-select-icon gemini-color">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2C12 7.52 16.48 12 22 12C16.48 12 12 16.48 12 22C12 16.48 7.52 12 2 12C7.52 12 12 7.52 12 2Z"/>
              </svg>
            </div>
            <span class="ai-select-name">Gemini</span>
            <span class="ai-select-state" id="modalStateGemini">Google</span>
          </button>
        </div>

        <div class="modal-actions">
          <button type="button" class="sao-btn sao-btn-amber" id="btnLinkAllNodes">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            <span>Link All 3 Nodes</span>
          </button>
          <button type="button" class="sao-btn" id="btnCloseAddPanel">Close</button>
        </div>
      </div>
    </div>

    <!-- ═══ Minimalist SAO Radial Ring Menu ═══ -->
    <div class="ring-menu-overlay" id="ringMenuOverlay" style="display:none;">
      <div class="ring-menu" id="ringMenu">
        <div class="ring-center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <polygon points="12 2 22 12 12 22 2 12 12 2"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <small>LINK</small>
        </div>

        <button type="button" class="ring-item ring-item-amber" data-action="send-all" style="--ring-angle: 0deg;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          <span class="ring-item-label">All-Link</span>
        </button>

        <button type="button" class="ring-item" data-action="send-chatgpt" style="--ring-angle: 90deg;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M12 2a4.5 4.5 0 0 0-3.89 2.25L4.2 11a4.5 4.5 0 0 0 0 4.5l3.91 6.75a4.5 4.5 0 0 0 7.78 0L19.8 15.5a4.5 4.5 0 0 0 0-4.5L15.89 4.25A4.5 4.5 0 0 0 12 2Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <span class="ring-item-label">ChatGPT</span>
        </button>

        <button type="button" class="ring-item" data-action="send-claude" style="--ring-angle: 180deg;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>
          </svg>
          <span class="ring-item-label">Claude</span>
        </button>

        <button type="button" class="ring-item" data-action="send-gemini" style="--ring-angle: 270deg;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M12 2C12 7.52 16.48 12 22 12C16.48 12 12 16.48 12 22C16.48 12 7.52 12 2 12C7.52 12 12 7.52 12 2Z"/>
          </svg>
          <span class="ring-item-label">Gemini</span>
        </button>
      </div>
    </div>

  </div>
  <script src="../../src/controllers/dashboard.js"></script>
</body>

</html>
